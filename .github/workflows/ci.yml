name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: ${{ matrix.java }} }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon build checkArchitecture
  agent-jdk-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix: { java: [17, 21, 25] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: ${{ matrix.java }} }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :agent:test
