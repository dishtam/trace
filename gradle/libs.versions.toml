[versions]
# Verified on Maven Central (repo.maven.apache.org maven-metadata.xml) 2026-10-28:
# byte-buddy latest stable 1.18.16, sqlite-jdbc 3.53.4.0, spring-boot 4.1.2 (latest
# stable, 4.2.x is RC), shadow plugin 9.6.1. Kotlin 2.3.21 = version bundled with
# the committed Gradle 9.6.0 wrapper (`gradle -v`). JUnit 5.13.4 = latest 5.x stable.
kotlin = "2.3.21"
bytebuddy = "1.18.16"
junit = "5.13.4"
sqlite = "3.53.4.0"
spring-boot = "4.1.2"
shadow = "9.6.1"

[libraries]
mcp-kotlin-sdk = { module = "io.modelcontextprotocol:kotlin-sdk", version = "0.16.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.10.2" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.17" }
kotlinx-io = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version = "0.9.1" }
duckdb-jdbc = { module = "org.duckdb:duckdb_jdbc", version = "2.0.0.0" }
bytebuddy = { module = "net.bytebuddy:byte-buddy", version.ref = "bytebuddy" }
bytebuddy-agent = { module = "net.bytebuddy:byte-buddy-agent", version.ref = "bytebuddy" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
h2 = { module = "com.h2database:h2", version = "2.3.232" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt = { id = "io.spring.dependency-management", version = "1.1.7" }
